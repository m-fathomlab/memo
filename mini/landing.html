<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo — 생각보다 빠른 AI 메모 앱</title>
<style>
  :root {
    --accent: #B8282F;        /* 포인트: 따뜻한 크리스마스 레드 */
    --accent-dark: #961E25;
    --accent-glow: rgba(184, 40, 47, .28);
    --cream: #FFF8EC;
    --cream-deep: #FDEBCB;
    --amber: #F6C77A;         /* 배경 글로우용 (포인트 아님) */
    --ink: #3A2418;
    --muted: #8A6B58;
    --line: #F0DDBF;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--cream);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1040px; margin: 0 auto; padding: 0 32px; }

  .btn {
    display: inline-block;
    padding: 17px 38px;
    background: linear-gradient(180deg, #C9313A 0%, var(--accent) 100%);
    color: #FFF8EC;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .02em;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 10px 28px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .btn:hover {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
    transform: translateY(-2px);
    box-shadow: 0 14px 34px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* Hero — 벽난로 불빛 같은 따뜻한 글로우 */
  .hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 150px 0 130px;
    background:
      radial-gradient(circle at 12% 18%, rgba(246,199,122,.55) 0, transparent 22%),
      radial-gradient(circle at 88% 12%, rgba(246,199,122,.45) 0, transparent 20%),
      radial-gradient(circle at 78% 82%, rgba(255,170,90,.30) 0, transparent 26%),
      radial-gradient(ellipse at 50% 100%, var(--cream-deep) 0%, var(--cream) 70%);
  }
  .hero .container { position: relative; }
  .hero .name {
    display: inline-block;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 30px;
    padding: 6px 18px;
    border: 1px solid var(--amber);
    border-radius: 999px;
    background: rgba(255,248,236,.7);
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: 66px;
    line-height: 1.22;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 26px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    font-size: 20px;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 52px;
  }

  /* Features */
  .features { padding: 120px 0; background: var(--cream); }
  .features h2 {
    text-align: center;
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 72px;
  }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .card {
    padding: 44px 32px;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: linear-gradient(180deg, #FFFDF8 0%, #FFF3DC 100%);
    box-shadow: 0 12px 30px rgba(120, 70, 20, .08);
  }
  .card .icon {
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    background: radial-gradient(circle at 35% 30%, #FFE9BE, var(--amber));
    border-radius: 50%;
    margin-bottom: 28px;
    box-shadow: 0 6px 16px rgba(246,199,122,.55);
  }
  .card h3 { font-family: var(--serif); font-size: 23px; font-weight: 700; margin-bottom: 12px; }
  .card p { font-size: 16px; color: var(--muted); }

  /* CTA */
  .cta {
    text-align: center;
    padding: 120px 0;
    background:
      radial-gradient(circle at 50% 120%, rgba(255,170,90,.38) 0, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
  }
  .cta h2 {
    font-family: var(--serif);
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 42px;
  }

  footer {
    text-align: center;
    padding: 32px 0;
    font-size: 14px;
    color: var(--muted);
    background: var(--cream-deep);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 768px) {
    .container { padding: 0 24px; }
    .hero { padding: 100px 0 84px; }
    .hero h1 { font-size: 40px; }
    .hero p { font-size: 17px; }
    .features { padding: 80px 0; }
    .features h2 { font-size: 28px; margin-bottom: 48px; }
    .cards { grid-template-columns: 1fr; }
    .cta { padding: 80px 0; }
    .cta h2 { font-size: 30px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="container">
    <div class="name">Lumo</div>
    <h1>생각보다 빠른<br><em>AI 메모 앱</em></h1>
    <p>떠오른 생각을 적는 순간, Lumo가 정리하고 연결해 드려요.</p>
    <a href="#" class="btn">무료로 시작하기</a>
  </div>
</header>

<section class="features">
  <div class="container">
    <h2>메모가 더 똑똑해지는 순간</h2>
    <div class="cards">
      <div class="card">
        <div class="icon">⚡</div>
        <h3>즉시 기록</h3>
        <p>앱을 열자마자 바로 입력해요.<br>기다림 없이 생각을 붙잡아 두세요.</p>
      </div>
      <div class="card">
        <div class="icon">✨</div>
        <h3>AI 자동 정리</h3>
        <p>흩어진 메모를 요약하고 분류해요.<br>정리는 Lumo에게 맡기세요.</p>
      </div>
      <div class="card">
        <div class="icon">🔍</div>
        <h3>똑똑한 검색</h3>
        <p>기억나는 단어 하나면 충분해요.<br>의미로 찾아 필요한 메모를 보여줘요.</p>
      </div>
    </div>
  </div>
</section>

<section class="cta">
  <div class="container">
    <h2>지금, 첫 메모를 남겨보세요</h2>
    <a href="#" class="btn">무료로 시작하기</a>
  </div>
</section>

<footer>
  <div class="container">© 2026 Lumo. All rights reserved.</div>
</footer>

</body>
</html>
