<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크리스마스 짝꿍 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e23d4b;
    --red-dark: #b8202f;
    --green: #2f9e5b;
    --green-dark: #1d6e3e;
    --gold: #ffd166;
    --cream: #fff8ec;
    --night1: #0d1b3d;
    --night2: #1f2f63;
    --text: #fffaf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--night2), var(--night1) 70%);
    background-color: var(--night1);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  /* ---------- 눈 ---------- */
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .flake {
    position: absolute; top: -20px; color: #fff; opacity: .85;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -20px) rotate(0deg); }
    50%  { transform: translate(30px, 50vh) rotate(180deg); }
    100% { transform: translate(-10px, 105vh) rotate(360deg); }
  }

  /* 바닥 눈 언덕 */
  .ground {
    position: fixed; left: -10%; right: -10%; bottom: -60px; height: 120px;
    background: #f4f8ff; border-radius: 50% 50% 0 0; z-index: 0;
    box-shadow: 0 -6px 30px rgba(255,255,255,.35);
  }

  main {
    position: relative; z-index: 1;
    max-width: 860px; margin: 0 auto; padding: 18px 16px 90px;
  }

  h1 {
    text-align: center; margin: 6px 0 4px;
    font-size: clamp(26px, 6vw, 44px); font-weight: normal;
    text-shadow: 0 3px 0 var(--red-dark), 0 0 18px rgba(255,209,102,.6);
    letter-spacing: 1px;
  }
  .sub { text-align: center; opacity: .8; margin: 0 0 14px; font-size: 15px; }

  /* 전구 줄 */
  .lights { display: flex; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .bulb {
    width: 12px; height: 18px; border-radius: 50% 50% 45% 45%;
    animation: twinkle 1.4s ease-in-out infinite alternate;
  }
  .bulb:nth-child(4n+1) { background: var(--red);  color: var(--red); }
  .bulb:nth-child(4n+2) { background: var(--gold); color: var(--gold); animation-delay: .35s; }
  .bulb:nth-child(4n+3) { background: var(--green);color: var(--green); animation-delay: .7s; }
  .bulb:nth-child(4n+4) { background: #6ec6ff;     color: #6ec6ff; animation-delay: 1.05s; }
  @keyframes twinkle { from { opacity: .35; box-shadow: none; } to { opacity: 1; box-shadow: 0 0 12px 3px currentColor; } }

  /* ---------- 상단 패널 ---------- */
  .panel {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
    margin-bottom: 12px;
  }
  .stat {
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18);
    border-radius: 14px; padding: 6px 12px; min-width: 76px; text-align: center;
    backdrop-filter: blur(4px);
  }
  .stat small { display: block; font-size: 12px; opacity: .75; }
  .stat b { font-size: 20px; font-weight: normal; }
  .stat.score b, .stat.best b { color: var(--gold); }
  .stat.pop { animation: statPop .5s ease; }
  @keyframes statPop { 40% { transform: scale(1.25); } }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  button {
    font-family: inherit; font-size: 16px; cursor: pointer; color: #fff;
    border: none; border-radius: 999px; padding: 8px 16px;
    background: var(--green); box-shadow: 0 4px 0 var(--green-dark);
    transition: transform .1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
  button.level.active { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); }
  button.ghost { background: rgba(255,255,255,.15); box-shadow: 0 4px 0 rgba(0,0,0,.25); }

  /* ---------- 보드 & 카드 ---------- */
  .board {
    display: grid; gap: 10px;
    grid-template-columns: repeat(var(--cols, 4), 1fr);
    max-width: calc(var(--cols, 4) * 130px);
    margin: 0 auto;
  }
  @media (min-width: 561px) {
    /* 화면 높이 안에 보드가 다 들어오도록 */
    .board {
      max-width: min(calc(var(--cols, 4) * 130px),
                     calc((100vh - 270px) * 0.75 * var(--cols, 4) / var(--rows, 4)));
      min-width: 300px;
    }
  }
  .card {
    aspect-ratio: 3 / 4; perspective: 800px; cursor: pointer;
  }
  .card .inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .22s ease-out;
    transform-style: preserve-3d;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  @media (hover: hover) {
    .card:not(.flipped):not(.matched):hover .inner { transform: rotate(-3deg) scale(1.04); }
  }
  .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 14px; }
  .card { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  .face {
    position: absolute; inset: 0; border-radius: 14px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
  }
  .back {
    border: 3px solid #fff;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 8px, transparent 8px 16px),
      linear-gradient(135deg, var(--red), var(--red-dark));
  }
  .card:nth-child(even) .back {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 8px, transparent 8px 16px),
      linear-gradient(135deg, var(--green), var(--green-dark));
  }
  /* 리본 */
  .back::before, .back::after {
    content: ""; position: absolute; background: var(--gold);
  }
  .back::before { left: 50%; top: 0; bottom: 0; width: 10px; transform: translateX(-50%); }
  .back::after  { top: 50%; left: 0; right: 0; height: 10px; transform: translateY(-50%); }
  .back span {
    position: relative; z-index: 1; font-size: clamp(18px, 4vw, 28px);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
  }
  .front {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 50% 35%, #fff, var(--cream));
    border: 3px solid var(--gold);
    font-size: clamp(30px, 8vw, 58px);
  }
  .card.matched .front {
    animation: glow 1.6s ease-in-out infinite alternate;
  }
  .card.matched { animation: bounce .7s ease; }
  @keyframes bounce {
    0% { transform: scale(1); } 30% { transform: scale(1.18) translateY(-8px); }
    55% { transform: scale(.95); } 75% { transform: scale(1.05); } 100% { transform: scale(1); }
  }
  @keyframes glow {
    from { box-shadow: 0 0 6px 2px rgba(255,209,102,.5); }
    to   { box-shadow: 0 0 22px 8px rgba(255,209,102,.9); }
  }
  .card.wrong { animation: shake .45s ease; }
  @keyframes shake {
    20%, 60% { transform: translateX(-7px) rotate(-3deg); }
    40%, 80% { transform: translateX(7px) rotate(3deg); }
  }

  /* ---------- 축하 문구 ---------- */
  .toast {
    position: fixed; left: 50%; top: 42%; z-index: 30; pointer-events: none;
    transform: translate(-50%, -50%);
    font-size: clamp(28px, 7vw, 52px); white-space: nowrap;
    color: var(--gold);
    text-shadow: 0 4px 0 var(--red-dark), 0 0 24px rgba(255,255,255,.8);
    animation: toastUp 1.3s ease forwards;
  }
  .toast small { display: block; text-align: center; font-size: .5em; color: #fff; }
  @keyframes toastUp {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-10deg); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
    35%  { transform: translate(-50%, -50%) scale(1) rotate(0); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
  }

  /* ---------- 효과 캔버스 ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* ---------- 썰매 ---------- */
  .sleigh {
    position: fixed; top: 14%; left: 0; z-index: 25; pointer-events: none;
    font-size: clamp(36px, 8vw, 64px); white-space: nowrap;
    animation: fly 5s linear forwards;
  }
  @keyframes fly {
    0%   { transform: translate(110vw, 40px); }
    50%  { transform: translate(35vw, -20px); }
    100% { transform: translate(-110%, 30px); }
  }

  /* ---------- 클리어 모달 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(5, 10, 30, .55);
  }
  .modal.show { display: flex; }
  .modal .box {
    background: linear-gradient(160deg, #fff, var(--cream)); color: #4a2b1a;
    border: 6px solid var(--red); border-radius: 26px;
    padding: 24px 28px; text-align: center; max-width: 360px; width: 100%;
    box-shadow: 0 0 0 6px #fff, 0 20px 50px rgba(0,0,0,.5);
    animation: boxIn .6s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes boxIn { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
  .modal h2 { margin: 4px 0 6px; font-size: 32px; font-weight: normal; color: var(--red); }
  .modal .big { font-size: 56px; line-height: 1; }
  .modal .rows { margin: 12px 0 18px; font-size: 18px; line-height: 1.7; }
  .modal .rows b { color: var(--green-dark); font-weight: normal; }
  .stars { font-size: 30px; letter-spacing: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .flake, .bulb { animation: none; }
    .card.matched, .card.wrong { animation: none; }
  }

  @media (max-width: 560px) {
    .board { gap: 7px; }
    .board { grid-template-columns: repeat(var(--mcols, 4), 1fr); }
    .face { border-radius: 10px; }
    .stat { min-width: 64px; padding: 5px 8px; }
    .stat b { font-size: 17px; }
    button { font-size: 14px; padding: 7px 12px; }
  }
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="ground"></div>
<canvas id="fx"></canvas>

<main>
  <h1>🎄 크리스마스 짝꿍 찾기 🎄</h1>
  <p class="sub">카드 두 장을 뒤집어 같은 그림을 찾아보세요!</p>
  <div class="lights" aria-hidden="true">
    <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
    <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
    <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
  </div>

  <div class="panel">
    <div class="stat score" id="scoreBox"><small>점수</small><b id="score">0</b></div>
    <div class="stat best"><small>🏆 최고</small><b id="best">-</b></div>
    <div class="stat"><small>시도</small><b id="tries">0</b></div>
    <div class="stat"><small>남은 짝</small><b id="left">0</b></div>
    <div class="stat"><small>시간</small><b id="time">0:00</b></div>
    <div class="stat"><small>콤보</small><b id="combo">-</b></div>
  </div>

  <div class="controls">
    <button class="level" data-level="easy">쉬움 ⛄</button>
    <button class="level active" data-level="normal">보통 🎁</button>
    <button class="level" data-level="hard">어려움 🦌</button>
    <button class="level" data-level="expert">고수 🐧</button>
    <button class="level" data-level="legend">전설 👑</button>
    <button class="ghost" id="restart">🔄 다시하기</button>
    <button class="ghost" id="mute">🔊</button>
  </div>

  <div class="board" id="board"></div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <div class="big">🎅🎉</div>
    <h2>메리 크리스마스!</h2>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <div class="rows">
      최종 점수 <b id="mScore">0</b><br>
      시도 횟수 <b id="mTries">0</b>번<br>
      걸린 시간 <b id="mTime">0:00</b><br>
      최고 점수 <b id="mBest">0</b>
    </div>
    <button id="again">🎄 한 판 더!</button>
  </div>
</div>

<script>
(() => {
  const PICS = ['🎅','🎄','⛄','🎁','🦌','🔔','🍪','⭐','🧦','🕯️','🍭','❄️',
                ' 🧤','🛷','🥛','🏠','🐧','🍫','🎿','🎶'].map(s => s.trim());
  const LEVELS = {
    easy:   { pairs: 6,  cols: 4, mcols: 4 },
    normal: { pairs: 8,  cols: 4, mcols: 4 },
    hard:   { pairs: 12, cols: 6, mcols: 4 },
    expert: { pairs: 15, cols: 6, mcols: 5 },
    legend: { pairs: 20, cols: 8, mcols: 5 },
  };
  const CHEERS = ['메리 크리스마스!', '호호호~ 잘했어요!', '딩동댕! 정답!', '산타가 칭찬해요!', '루돌프도 깜짝!', '최고예요! ✨', '눈부신 실력!'];

  const $ = id => document.getElementById(id);
  const board = $('board');

  let level = 'normal';
  let first = null, second = null, lock = false;
  let score = 0, tries = 0, left = 0, combo = 0;
  let startTime = 0, timerId = null, elapsed = 0;
  let muted = false;
  let gameId = 0, fwTimer = null;   // 이전 판의 타이머가 새 판에 끼어들지 않도록 구분
  const bestKey = lv => `xmas-memory-best-${lv}`;
  const getBest = lv => { try { return +localStorage.getItem(bestKey(lv)) || 0; } catch (e) { return 0; } };
  const setBest = (lv, v) => { try { localStorage.setItem(bestKey(lv), v); } catch (e) {} };

  // ---------- 눈송이 ----------
  const snow = $('snow');
  const flakeChars = ['❄', '❅', '❆', '•'];
  for (let i = 0; i < 45; i++) {
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = flakeChars[i % flakeChars.length];
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = (8 + Math.random() * 16) + 'px';
    f.style.animationDuration = (7 + Math.random() * 10) + 's';
    f.style.animationDelay = (-Math.random() * 15) + 's';
    f.style.opacity = (.4 + Math.random() * .6).toFixed(2);
    snow.appendChild(f);
  }

  // ---------- 게임 ----------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function newGame(lv = level) {
    level = lv;
    const { pairs, cols, mcols } = LEVELS[level];
    const pics = shuffle(PICS.slice()).slice(0, pairs);
    const deck = shuffle([...pics, ...pics]);

    gameId++;
    clearInterval(fwTimer);
    parts = [];
    document.querySelectorAll('.toast, .sleigh').forEach(e => e.remove());
    first = second = null; lock = false;
    score = 0; tries = 0; combo = 0; left = pairs; elapsed = 0;
    clearInterval(timerId); timerId = null; startTime = 0;
    updateStats();
    $('time').textContent = '0:00';
    $('modal').classList.remove('show');

    board.style.setProperty('--cols', cols);
    board.style.setProperty('--rows', pairs * 2 / cols);
    board.style.setProperty('--mcols', mcols);
    $('best').textContent = getBest(level) || '-';
    board.innerHTML = '';
    const backIcons = ['❄️', '⭐', '🎀'];
    deck.forEach((pic, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pic = pic;
      card.innerHTML =
        `<div class="inner">
           <div class="face back"><span>${backIcons[i % 3]}</span></div>
           <div class="face front">${pic}</div>
         </div>`;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', '카드');
      card.addEventListener('click', () => onCardClick(card));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCardClick(card); }
      });
      board.appendChild(card);
    });

    document.querySelectorAll('.level').forEach(b =>
      b.classList.toggle('active', b.dataset.level === level));
  }

  function startTimer() {
    startTime = Date.now();
    timerId = setInterval(() => {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      $('time').textContent = fmt(elapsed);
    }, 250);
  }
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  function onCardClick(card) {
    if (lock || card === first || card.classList.contains('matched')) return;
    if (!timerId) startTimer();
    ensureAudio();
    card.classList.add('flipped');
    playFlip();

    if (!first) { first = card; return; }
    second = card;
    lock = true;
    tries++;
    const gid = gameId;
    setTimeout(() => { if (gid === gameId) checkMatch(); }, 250);
  }

  function checkMatch() {
    if (first.dataset.pic === second.dataset.pic) {
      combo++;
      const gain = 100 + (combo - 1) * 50;
      score += gain; left--;
      [first, second].forEach(c => { c.classList.remove('flipped'); c.classList.add('matched'); });
      celebrate(first, second, gain);
      first = second = null; lock = false;
      updateStats(true);
      if (left === 0) { const gid = gameId; setTimeout(() => { if (gid === gameId) win(); }, 900); }
    } else {
      combo = 0;
      updateStats();
      [first, second].forEach(c => c.classList.add('wrong'));
      playBuzz();
      const gid = gameId;
      setTimeout(() => {
        if (gid !== gameId) return;
        [first, second].forEach(c => c.classList.remove('flipped', 'wrong'));
        first = second = null; lock = false;
      }, 600);
    }
  }

  function updateStats(pop) {
    $('score').textContent = score;
    $('tries').textContent = tries;
    $('left').textContent = left;
    $('combo').textContent = combo > 1 ? `x${combo} 🔥` : '-';
    if (pop) {
      const box = $('scoreBox');
      box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    }
  }

  function celebrate(a, b, gain) {
    [a, b].forEach(c => {
      const r = c.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 70);
    });
    const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    showToast(`+${gain}!`, combo > 1 ? `${combo}콤보! ${cheer}` : cheer);
    playChime(combo);
  }

  function showToast(main, small) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `${main}<small>${small}</small>`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1400);
  }

  function win() {
    clearInterval(timerId); timerId = null;
    const pairs = LEVELS[level].pairs;
    const ratio = tries / pairs;
    $('stars').textContent = ratio <= 1.6 ? '⭐⭐⭐' : ratio <= 2.4 ? '⭐⭐' : '⭐';
    $('mScore').textContent = score;
    $('mTries').textContent = tries;
    $('mTime').textContent = fmt(elapsed);
    const prev = getBest(level);
    const record = score > prev;
    if (record) setBest(level, score);
    $('best').textContent = Math.max(prev, score);
    $('mBest').textContent = record ? `${score} 🎉 신기록!` : prev;
    $('modal').classList.add('show');
    confetti();
    sleigh();
    playFanfare();
    let n = 0;
    clearInterval(fwTimer);
    fwTimer = setInterval(() => {
      burst(Math.random() * innerWidth, innerHeight * (.15 + Math.random() * .4), 90);
      if (++n > 9) clearInterval(fwTimer);
    }, 380);
  }

  function sleigh() {
    const s = document.createElement('div');
    s.className = 'sleigh';
    s.textContent = '🦌🦌🛷🎅✨';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5200);
  }

  // ---------- 파티클 ----------
  const cvs = $('fx'), ctx = cvs.getContext('2d');
  let parts = [], running = false;
  const COLORS = ['#e23d4b', '#2f9e5b', '#ffd166', '#ffffff', '#6ec6ff', '#ff8fab'];
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 7;
      parts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2,
        g: .12, drag: .97, life: 60 + Math.random() * 40, age: 0,
        size: 3 + Math.random() * 5, color: COLORS[i % COLORS.length],
        shape: ['star', 'circle', 'flake'][i % 3], rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      });
    }
    run();
  }

  function confetti() {
    for (let i = 0; i < 220; i++) {
      parts.push({
        x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6,
        vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
        g: .03, drag: .995, life: 260 + Math.random() * 120, age: 0,
        size: 5 + Math.random() * 6, color: COLORS[i % COLORS.length],
        shape: 'rect', rot: Math.random() * 6, vr: (Math.random() - .5) * .25,
      });
    }
    run();
  }

  function drawStar(r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .45 : r;
      const a = i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }
  function drawFlake(r) {
    ctx.lineWidth = Math.max(1, r / 3);
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      ctx.moveTo(-Math.cos(a) * r, -Math.sin(a) * r);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.stroke();
  }

  function run() {
    if (running) return;
    running = true;
    requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.age < p.life);
    for (const p of parts) {
      p.age++;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const fade = Math.min(1, (p.life - p.age) / 25);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = ctx.strokeStyle = p.color;
      if (p.shape === 'star') drawStar(p.size);
      else if (p.shape === 'flake') drawFlake(p.size);
      else if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- 소리 (Web Audio) ----------
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, start, dur, type = 'sine', vol = .18) {
    if (muted || !actx) return;
    const t0 = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  const playFlip = () => tone(880, 0, .08, 'triangle', .08);
  const playBuzz = () => { tone(220, 0, .18, 'square', .05); tone(196, .12, .22, 'square', .05); };
  function playChime(c) {
    const up = Math.min(c - 1, 5) * 2;
    const notes = [72, 76, 79, 84].map(n => 440 * Math.pow(2, (n + up - 69) / 12));
    notes.forEach((f, i) => { tone(f, i * .07, .6, 'sine', .16); tone(f * 2, i * .07, .3, 'triangle', .04); });
  }
  function playFanfare() {
    // 징글벨 첫 소절 느낌
    const m = [[76,.0],[76,.18],[76,.36],[76,.66],[76,.84],[76,1.02],[76,1.32],[79,1.5],[72,1.68],[74,1.86],[76,2.04]];
    m.forEach(([n, t]) => tone(440 * Math.pow(2, (n - 69) / 12), t, .35, 'triangle', .14));
  }

  // ---------- 컨트롤 ----------
  document.querySelectorAll('.level').forEach(b =>
    b.addEventListener('click', () => newGame(b.dataset.level)));
  $('restart').addEventListener('click', () => newGame());
  $('again').addEventListener('click', () => newGame());
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').textContent = muted ? '🔇' : '🔊';
  });

  newGame('normal');
})();
</script>
</body>
</html>
